name: Run 9router with Cloudflare Tunnel

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duration to keep 9router running (in hours, max 6)'
        required: false
        default: '6'
  schedule:
    # Optional scheduled run: Every 6 hours
    - cron: '0 */6 * * *'

jobs:
  run-9router:
    name: Start 9router & Cloudflare Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install 9router & Cloudflare Tunnel
        run: |
          echo "📦 Installing 9router globally via npm..."
          npm install -g 9router || npm install -g decolua/9router || true
          
          echo "📥 Installing cloudflared CLI..."
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Run 9router & Cloudflare Tunnel
        env:
          # Server settings
          ROUTER_PORT: ${{ secrets.ROUTER_PORT || '20128' }}
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY || 'sk-9router-secret-key-12345' }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          
          # AI Provider API Keys from GitHub Secrets (override api_keys.env if present)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          chmod +x scripts/start-tunnel.sh
          # Set workflow runtime limit (default 6 hours or specified hours)
          HOURS="${{ github.event.inputs.duration_hours || '6' }}"
          TIMEOUT_SECONDS=$((HOURS * 3600 - 300))
          if [ $TIMEOUT_SECONDS -le 0 ]; then
            TIMEOUT_SECONDS=21300
          fi
          
          echo "⏱️ Running 9router for $HOURS hour(s) ($TIMEOUT_SECONDS seconds)..."
          timeout $TIMEOUT_SECONDS bash scripts/start-tunnel.sh || true
