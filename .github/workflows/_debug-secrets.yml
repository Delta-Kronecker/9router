name: Debug Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDERS_CONF: ${{ secrets.PROVIDERS_CONF }}
        run: |
          for v in ROUTER_API_KEY CLOUDFLARE_TUNNEL_TOKEN GEMINI_API_KEY PROVIDERS_CONF; do
            val="${!v}"
            if [ -n "$val" ]; then echo "$v = SET (length ${#val})"; else echo "$v = EMPTY"; fi
          done
